<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoTeach — Addition Tutor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>SoTeach</h1>
    <p class="tagline">Tell us your name, your class, and what you want to practise. The tutor will guide you step by step.</p>

    <form id="start-form">
      <div class="field">
        <label for="learner-name">Your name</label>
        <input id="learner-name" type="text" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="grade-band">Class / age band</label>
        <select id="grade-band" required></select>
      </div>
      <div class="field">
        <label for="subject">Subject</label>
        <select id="subject" required></select>
      </div>
      <div class="field">
        <label for="topic">Topic</label>
        <select id="topic" required></select>
      </div>
      <button id="begin-button" type="submit">Begin</button>
    </form>

    <section id="transcript" aria-live="polite" hidden></section>

    <form id="chat-form" hidden>
      <label for="answer" class="visually-hidden">Your answer</label>
      <input id="answer" type="text" autocomplete="off" placeholder="Type your answer…">
      <button type="submit">Send</button>
    </form>
  </main>
  <script src="/app.js"></script>
</body>
</html>
